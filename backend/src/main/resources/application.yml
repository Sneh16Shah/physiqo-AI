# ── Common defaults (all profiles) ──────────────────────────────────────────────
# Profile-specific files (dev, test, prod) override these values.
# See docs/ARCHITECTURE.md §12, docs/DEPLOYMENT.md §4.

spring:
  application:
    name: physiqo-backend

  data:
    redis:
      repositories:
        enabled: false

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    open-in-view: false                  # Detached entity best practice
    hibernate:
      ddl-auto: update                 # Schema managed by Flyway, never Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway (database migrations) ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson (JSON) ──────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # ISO 8601 strings per API_SPEC.md
    deserialization:
      fail-on-unknown-properties: false

  # ── Servlet ───────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB                # docs/ARCHITECTURE.md §8
      max-request-size: 10MB

  # ── DevTools (hot reload — auto-disabled when not dev profile) ──────────────
  devtools:
    restart:
      enabled: false

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── Actuator ───────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ─────────────────────────────────────────────────────────────────────
logging:
  level:
    root: info
    com.physiqo: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
