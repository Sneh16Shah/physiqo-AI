# PhysiqO-AI — Docker Compose
#
# Infrastructure services (always run): PostgreSQL, Redis, MinIO.
# Application services (opt-in via profiles):
#   - `backend`     : Spring Boot, profile `app`
#   - `ai-service`  : FastAPI,    profile `app`
#   - `frontend`    : React Nginx, profile `app`
#
# Bring up everything (full stack):
#     docker compose --profile app up -d --build
#

name: physiqo

networks:
  physiqo-net:
    name: physiqo-net
    driver: bridge

volumes:
  pgdata:
    name: physiqo-pgdata
  redisdata:
    name: physiqo-redisdata
  miniodata:
    name: physiqo-miniodata

services:
  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — system of record (owned by Spring Boot)
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: physiqo-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-physiqo}
      POSTGRES_USER: ${POSTGRES_USER:-physiqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physiqo_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-physiqo}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - physiqo-net

  # ──────────────────────────────────────────────────────────────────────────
  # Redis 7 — sessions, rate limiting, refresh tokens, cache
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: physiqo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - physiqo-net

  # ──────────────────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage for uploaded files
  # ──────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: physiqo-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-physiqo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-physiqo_dev}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - physiqo-net

  # ──────────────────────────────────────────────────────────────────────────
  # Python AI Service (opt-in via `--profile app`)
  # ──────────────────────────────────────────────────────────────────────────
  ai-service:
    image: physiqo-ai-service
    container_name: physiqo-ai-service
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SERVICE_KEY: ${AI_SERVICE_KEY:-dev-service-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - physiqo-net

  # ──────────────────────────────────────────────────────────────────────────
  # Spring Boot backend (opt-in via `--profile app`)
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    image: physiqo-backend
    container_name: physiqo-backend
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-physiqo}
      POSTGRES_USER: ${POSTGRES_USER:-physiqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physiqo_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-physiqo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-physiqo_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-physiqo-uploads}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-dev-service-key}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      disable: true
    networks:
      - physiqo-net

  # ──────────────────────────────────────────────────────────────────────────
  # React Frontend (opt-in via `--profile app`)
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    image: physiqo-frontend
    container_name: physiqo-frontend
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - physiqo-net
